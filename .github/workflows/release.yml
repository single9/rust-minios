name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER=$(git-cliff --bump ${{ inputs.bump }} --bumped-version)
            echo "version=v$VER" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION#v}\"/" Cargo.toml
          git-cliff --tag "$VERSION" --output CHANGELOG.md
          git add Cargo.toml CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag "$VERSION"
          git push
          git push --tags

      - name: Generate changelog
        run: |
          git-cliff --tag "${{ steps.version.outputs.version }}" --output CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install zig
        run: |
          curl -fsSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar xJ
          echo "$PWD/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Build Linux (x86_64)
        run: cargo build --release

      - name: Build macOS (Intel)
        run: cargo zigbuild --release --target x86_64-apple-darwin

      - name: Build macOS (ARM64)
        run: cargo zigbuild --release --target aarch64-apple-darwin

      - name: Package artifacts
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist

          cp target/release/rust-minios dist/rust-minios-x86_64-linux
          cp target/x86_64-apple-darwin/release/rust-minios dist/rust-minios-x86_64-macos
          cp target/aarch64-apple-darwin/release/rust-minios dist/rust-minios-aarch64-macos

          for f in dist/rust-minios-*; do
            plat="${f#dist/rust-minios-}"
            cp README.md "dist/README.md"
            cp -r docs "dist/docs"
            cd dist
            tar czf "../rust-minios-${VERSION}-${plat}.tar.gz" "rust-minios-${plat}" README.md docs
            cd ..
            rm -rf dist/docs dist/README.md "dist/rust-minios-${plat}"
          done
          rm -rf dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: rust-minios-${{ needs.version.outputs.version }}-*.tar.gz

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            rust-minios-*.tar.gz
          draft: false
          prerelease: false
